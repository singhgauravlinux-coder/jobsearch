name: Build & Push Images

# Scope, on purpose: build both Docker images and push them to GHCR, tagged
# both :latest and :<git-sha>. Nothing else - no lint/tests/manifest checks,
# no automatic kubectl update. Pull the new tag onto the cluster yourself
# (kubectl set image, or ./setup.sh) whenever you're ready to deploy it.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-and-push:
    name: Build & push (${{ matrix.image }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: backend
            context: backend
            repo: ai-job-search-backend
          - image: frontend
            context: frontend
            repo: ai-job-search-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.repo }}:latest
            ghcr.io/${{ github.repository_owner }}/${{ matrix.repo }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
